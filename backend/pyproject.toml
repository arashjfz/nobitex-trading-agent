[project]
name = "nobitex-trading-agent"
version = "0.1.0"
description = "Trading agent assistant for the Nobitex exchange, built on the OpenHands Agent SDK"
requires-python = ">=3.12"
dependencies = [
    "openhands-sdk",
    "openhands-tools",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "cryptography>=42.0.0",
    "nobitex-mcp",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.uv.sources]
nobitex-mcp = { path = "../mcp/nobitex-mcp", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
