[project]
name = "nobitex-mcp"
version = "1.0.0"
description = "Complete Model Context Protocol server for the Nobitex exchange API (mainnet + testnet)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
nobitex-mcp = "nobitex_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nobitex_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
